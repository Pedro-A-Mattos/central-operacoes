name: Publicar no GitHub Pages

# Publica apenas a interface (modo efêmero, sem backend e sem persistência).
# Gera dist/index.html com `node build.mjs --publico` e envia para o Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela uma que esteja em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build da interface (modo efêmero)
        working-directory: frontend
        run: node build.mjs --publico
      - name: Preparar artefato do Pages
        run: |
          mkdir -p site
          cp frontend/dist/index.html site/index.html
          # Regras de piso versionadas: GitHub -> aplicação (somente leitura).
          cp frontend/public/regras_piso.json site/regras_piso.json
          # Evita o processamento Jekyll (não é necessário para um HTML único).
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
